---

version: 2.1

orbs:
  qqq-orb: kingsrook/qqq-orb@0.6.0

workflows:

  test_only:
    jobs:
      - qqq-orb/mvn_test_only:
          context: [qqq-maven-registry-credentials, build-qqq-sample-app]
          filters:
            branches:
              ignore: /(develop|release/.*|hotfix/.*|integration.*)/
            tags:
              only: []
      # Static analysis runs in parallel with tests
      - qqq-orb/static_analysis:
          context: [qqq-maven-registry-credentials]
          filters:
            branches:
              ignore: /(develop|release/.*|hotfix/.*|integration.*)/
            tags:
              only: []

  publish_snapshot:
    jobs:
      - qqq-orb/mvn_publish:
          context: [qqq-maven-registry-credentials, build-qqq-sample-app]
          branch_type: snapshot
          filters:
            branches:
              only:
                - develop
      - qqq-orb/static_analysis:
          context: [qqq-maven-registry-credentials]
          filters:
            branches:
              only:
                - develop

  publish_feature:
    jobs:
      - qqq-orb/mvn_publish:
          context: [qqq-maven-registry-credentials]
          branch_type: feature
          filters:
            branches:
              only:
                - feature/.*
            tags:
              only: [/publish.*/]

  publish_release_candidate:
    jobs:
      - qqq-orb/static_analysis:
          name: candidate_static_analysis
          context: [qqq-maven-registry-credentials]
          filters:
            branches:
              only:
                - /release\/.*/
      - qqq-orb/mvn_publish:
          context: [qqq-maven-registry-credentials, build-qqq-sample-app]
          branch_type: release_candidate
          requires: [candidate_static_analysis]
          filters:
            branches:
              only:
                - /release\/.*/

  publish_release:
    jobs:
      - qqq-orb/static_analysis:
          name: release_static_analysis
          context: [qqq-maven-registry-credentials]
          filters:
            branches:
              ignore: /.*/
            tags:
              only: /^v[0-9]+\.[0-9]+\.[0-9]+$/
      - qqq-orb/mvn_publish:
          context: [qqq-maven-registry-credentials, build-qqq-sample-app]
          branch_type: release
          requires: [release_static_analysis]
          filters:
            branches:
              ignore: /.*/
            tags:
              only: /^v[0-9]+\.[0-9]+\.[0-9]+$/

  publish_hotfix_release:
    jobs:
      - qqq-orb/mvn_publish:
          context: [qqq-maven-registry-credentials, build-qqq-sample-app]
          branch_type: hotfix
          filters:
            branches:
              only:
                - /hotfix\/.*/
