---

version: 2.1

orbs:
  qqq-orb: kingsrook/qqq-orb@0.6.0

commands:
  configure-package-install:
    steps:
      - run:
          name: Keep package installation unattended
          command: |
            # These build machines are discarded after the job.
            sudo install -d /etc/needrestart/conf.d
            printf '%s\n' '$nrconf{restart} = "l";' | sudo tee /etc/needrestart/conf.d/99-qqq-ci.conf >/dev/null

workflows:

  test_only:
    jobs:
      - qqq-orb/mvn_test_only:
          pre-steps:
            - configure-package-install
          context: [qqq-maven-registry-credentials, build-qqq-sample-app]
          filters:
            branches:
              ignore: /(develop|release/.*|hotfix/.*|integration.*)/
            tags:
              only: []
      # Static analysis runs in parallel with tests
      - qqq-orb/static_analysis:
          pre-steps:
            - configure-package-install
          context: [qqq-maven-registry-credentials]
          filters:
            branches:
              ignore: /(develop|release/.*|hotfix/.*|integration.*)/
            tags:
              only: []

  publish_snapshot:
    jobs:
      - qqq-orb/mvn_publish:
          pre-steps:
            - configure-package-install
          context: [qqq-maven-registry-credentials, build-qqq-sample-app]
          branch_type: snapshot
          filters:
            branches:
              only:
                - develop
      - qqq-orb/static_analysis:
          pre-steps:
            - configure-package-install
          context: [qqq-maven-registry-credentials]
          filters:
            branches:
              only:
                - develop

  publish_feature:
    jobs:
      - qqq-orb/mvn_publish:
          pre-steps:
            - configure-package-install
          context: [qqq-maven-registry-credentials]
          branch_type: feature
          filters:
            branches:
              only:
                - feature/.*
            tags:
              only: [/publish.*/]

  publish_release_candidate:
    jobs:
      - qqq-orb/static_analysis:
          pre-steps:
            - configure-package-install
          name: candidate_static_analysis
          context: [qqq-maven-registry-credentials]
          filters:
            branches:
              only:
                - /release\/.*/
      - qqq-orb/mvn_publish:
          pre-steps:
            - configure-package-install
          context: [qqq-maven-registry-credentials, build-qqq-sample-app]
          branch_type: release_candidate
          requires: [candidate_static_analysis]
          filters:
            branches:
              only:
                - /release\/.*/

  publish_release:
    jobs:
      - qqq-orb/static_analysis:
          pre-steps:
            - configure-package-install
          name: release_static_analysis
          context: [qqq-maven-registry-credentials]
          filters:
            branches:
              ignore: /.*/
            tags:
              only: /^v[0-9]+\.[0-9]+\.[0-9]+$/
      - qqq-orb/mvn_publish:
          pre-steps:
            - configure-package-install
          context: [qqq-maven-registry-credentials, build-qqq-sample-app]
          branch_type: release
          requires: [release_static_analysis]
          filters:
            branches:
              ignore: /.*/
            tags:
              only: /^v[0-9]+\.[0-9]+\.[0-9]+$/

  publish_hotfix_release:
    jobs:
      - qqq-orb/mvn_publish:
          pre-steps:
            - configure-package-install
          context: [qqq-maven-registry-credentials, build-qqq-sample-app]
          branch_type: hotfix
          filters:
            branches:
              only:
                - /hotfix\/.*/
